name: iOS IPA (SideStore)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the IPA to (run on the same tag); leave empty for a preview'
        type: string
        required: false
        default: ''
  push:
    branches:
      - codex/experiment-sidestore-ipa
      - main

permissions:
  contents: read

concurrency:
  group: ios-sidestore-${{ github.ref }}
  cancel-in-progress: ${{ inputs.release_tag == '' }}

jobs:
  ipa:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        target: [device, simulator]
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Show build tools
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          bun --version
          pod --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check source
        run: |
          bun run lint
          bun run typecheck
          bun test

      - name: Check native widget schedule
        run: |
          bun scripts/build-ios-widget-data.ts "$RUNNER_TEMP/timetable.json"
          swiftc native/ios-widget/WidgetSchedule.swift native/ios-widget/WidgetScheduleTests.swift -o "$RUNNER_TEMP/widget-schedule-tests"
          "$RUNNER_TEMP/widget-schedule-tests" "$RUNNER_TEMP/timetable.json"

      - name: Configure standalone build
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bun scripts/configure-ios-build.ts

      - name: Generate iOS project
        env:
          NODE_ENV: production
        run: bunx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios 2>&1 | tee "$RUNNER_TEMP/ios-pods.log"

      - name: Archive unsigned app
        env:
          NODE_ENV: production
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          destination='generic/platform=iOS'
          if [ "$BUILD_TARGET" = simulator ]; then
            destination='generic/platform=iOS Simulator'
          fi
          xcodebuild archive \
            -workspace ios/KojoringTime.xcworkspace \
            -scheme KojoringTime \
            -configuration Release \
            -destination "$destination" \
            -archivePath "$RUNNER_TEMP/KojoringTime.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            2>&1 | tee "$RUNNER_TEMP/ios-build.log"

      - name: Package and verify IPA
        if: matrix.target == 'device'
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/KojoringTime.xcarchive/Products/Applications/KojoringTime.app"
          test -s "$app/main.jsbundle"
          test -s "$app/PlugIns/KojoriBusWidget.appex/KojoriBusWidget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneOS
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          file "$app/$executable" | grep arm64

          mkdir -p "$RUNNER_TEMP/sidestore/Payload" "$RUNNER_TEMP/ios-artifacts"
          ditto "$app" "$RUNNER_TEMP/sidestore/Payload/KojoringTime.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/sidestore/Payload" "$RUNNER_TEMP/ios-artifacts/KojoringTime-sidestore.ipa"
          unzip -tq "$RUNNER_TEMP/ios-artifacts/KojoringTime-sidestore.ipa"
          (cd "$RUNNER_TEMP/ios-artifacts" && shasum -a 256 KojoringTime-sidestore.ipa > SHA256SUMS.txt)
          {
            echo '### SideStore IPA'
            echo 'Download the **sidestore-ipa** artifact, extract the ZIP, and import the `.ipa` into SideStore.'
            echo 'Unsigned arm64 Release build with embedded JS and OTA updates disabled. No Apple credentials or Expo login used.'
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        if: matrix.target == 'device'
        uses: actions/upload-artifact@v4
        with:
          name: sidestore-ipa
          path: ${{ runner.temp }}/ios-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Package simulator app
        if: matrix.target == 'simulator'
        run: |
          app="$RUNNER_TEMP/KojoringTime.xcarchive/Products/Applications/KojoringTime.app"
          test -s "$app/main.jsbundle"
          test -s "$app/PlugIns/KojoriBusWidget.appex/KojoriBusWidget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneSimulator
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/KojoringTime-simulator.zip"

      - name: Upload simulator app
        if: matrix.target == 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: ${{ runner.temp }}/KojoringTime-simulator.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Set up Java for iOS UI checks
        if: matrix.target == 'simulator'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro CLI
        if: matrix.target == 'simulator'
        run: |
          curl -fL --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Run iPhone interface checks
        if: matrix.target == 'simulator'
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
        run: |
          set -euo pipefail
          read -r runtime device_type < <(xcrun simctl list runtimes -j | python3 scripts/ios-simulator-device.py)
          simulator=$(xcrun simctl create KojoringUITest "$device_type" "$runtime")
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl install "$simulator" "$RUNNER_TEMP/KojoringTime.xcarchive/Products/Applications/KojoringTime.app"
          maestro --device "$simulator" test .maestro/ios-smoke.yml --test-output-dir "$RUNNER_TEMP/ios-ui-checks" --format junit --output "$RUNNER_TEMP/ios-ui-checks/results.xml"

      - name: Upload iOS screenshots and UI results
        if: ${{ always() && matrix.target == 'simulator' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-checks
          path: ${{ runner.temp }}/ios-ui-checks/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/ios-pods.log
            ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Attach IPA to GitHub release
    needs: ipa
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sidestore-ipa
          path: ipa
      - name: Verify tag and publish versioned assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          # A date tag can be replaced by a re-release while this build runs.
          # Never attach an obsolete binary to that newer release.
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$GITHUB_SHA"
          gh release view "$RELEASE_TAG" > /dev/null
          cd ipa
          sha256sum --check SHA256SUMS.txt
          asset="kojoring-time-$RELEASE_TAG-sidestore.ipa"
          mv KojoringTime-sidestore.ipa "$asset"
          sha256sum "$asset" > "$asset.sha256"
          gh release upload "$RELEASE_TAG" "$asset" "$asset.sha256" --clobber
          echo "IPA published: $(gh release view "$RELEASE_TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
